<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Reservas — HOTEL CASA BLANCA</title>
  <script src="08_ventas_mp.js" defer></script>
</head>
<body>
  <h1>Gestor de Reservas</h1>

  <form id="formulario">
    <input type="text"   id="direccion"   placeholder="Nombre del huésped" required>
    <input type="text"   id="descripcion" placeholder="Tipo de habitación (Individual / Doble / Suite...)" required>
    <input type="number" id="precio"      placeholder="Tarifa por noche (USD)" required>
    <button type="submit">Agregar Reserva</button>
  </form>

  <section id="contenedorCasas"></section>
</body>
</html>
